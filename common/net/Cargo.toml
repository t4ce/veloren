[package]
name = "veloren-common-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
simd = ["vek/platform_intrinsics"]

default = ["simd"]

[dependencies]
common = {package = "veloren-common", path = "../../common"}
#inline_tweak = { workspace = true }

bincode = { workspace = true }
flate2 = "1.0.20"
lz4_flex = { version = "0.11.6", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
image = { workspace = true, features = ["jpeg"] }
num-traits = { workspace = true }
sum_type = "0.2.0"
vek = { workspace = true }
tracing = { workspace = true }

# Data structures
hashbrown = { workspace = true }

# ECS
specs = { workspace = true, features = ["serde", "storage-event-control"] }

# Serde
serde = { workspace = true }
